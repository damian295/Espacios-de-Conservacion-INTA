<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espacios de Conservación | V61 candidata</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9f6fb;font-family:system-ui,Arial,sans-serif}#app{position:fixed;inset:0;width:100vw;height:100dvh;border:0;background:#e9f6fb;visibility:hidden}.loader{position:fixed;inset:0;display:grid;place-items:center;background:#e9f6fb;color:#063f69;z-index:5;text-align:center}.loader b{display:block;font-weight:1000;font-size:clamp(1.25rem,5vw,1.7rem);line-height:1.28}#badge{position:fixed;left:8px;bottom:8px;z-index:999999;background:#0b8fca;color:#fff;border-radius:999px;padding:8px 11px;font:900 13px system-ui;box-shadow:0 5px 18px rgba(0,0,0,.25);pointer-events:none}
</style>
</head>
<body>
<div class="loader" id="loader"><b>Cargando V.61<br>Espacios de Conservación<br>INTA - BID</b></div>
<iframe id="app" title="Espacios de Conservación"></iframe>
<div id="badge">v61</div>
<script>
(function(){
  const app=document.getElementById('app');
  const loader=document.getElementById('loader');
  const phone=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent||'')||((navigator.maxTouchPoints||0)>1&&Math.min(screen.width||0,screen.height||0)<900);
  app.src='plataforma-v54-candidata.html?v=v61-base-'+Date.now();
  const desktopFixCSS=`
    @media (min-width:700px){
      body.field-mode .legend-card, .legend-card{display:block!important;grid-template-columns:none!important;gap:0!important;align-items:initial!important;padding:22px!important;border-radius:26px!important;transform:none!important}
      body.field-mode .legend-card h3, .legend-card h3{display:block!important;grid-column:auto!important;margin:0 0 18px!important;line-height:1.1!important}
      body.field-mode .legend-item, .legend-item{display:grid!important;grid-template-columns:56px 1fr!important;gap:12px!important;align-items:start!important;justify-items:stretch!important;text-align:left!important;margin:0 0 18px!important;padding:0!important;border:0!important;border-radius:0!important;background:transparent!important;min-width:0!important;width:auto!important}
      body.field-mode .legend-symbol, .legend-symbol{width:54px!important;height:54px!important;font-size:1.25rem!important;margin:0!important;border-width:3px!important}
      body.field-mode .legend-item b, .legend-item b{display:block!important;font-size:inherit!important;white-space:normal!important;overflow:visible!important;text-overflow:clip!important;max-width:none!important;line-height:1.15!important}
      body.field-mode .legend-item p, .legend-item p{display:block!important;font-size:.91rem!important;line-height:1.25!important;margin:3px 0 0!important;white-space:normal!important;overflow:visible!important;text-overflow:clip!important;max-width:none!important}
      body.field-mode .legend-more, .legend-more{display:inline-block!important;grid-column:auto!important;border:0!important;border-radius:0!important;background:transparent!important;color:var(--blue-deep)!important;font-weight:950!important;padding:0!important;margin:0!important;width:auto!important;height:auto!important;min-height:0!important;text-align:left!important;box-shadow:none!important;white-space:normal!important;place-items:initial!important}
    }
  `;
  const sharedCSS=`
    #v61-inner{position:fixed;right:8px;bottom:8px;z-index:999999;background:#0b8fca;color:#fff;border-radius:999px;padding:7px 10px;font:900 12px system-ui;box-shadow:0 5px 18px rgba(0,0,0,.22);pointer-events:none}
  `;
  function walkDocs(){const docs=[];function walk(win,depth){if(!win||depth>10)return;try{const d=win.document;if(d&&d.body){docs.push(d);d.querySelectorAll('iframe').forEach(f=>{try{walk(f.contentWindow,depth+1)}catch(e){}});}}catch(e){}}try{walk(app.contentWindow,0)}catch(e){}return docs;}
  function addStyle(doc,id,txt){if(!doc.getElementById(id)){const st=doc.createElement('style');st.id=id;st.textContent=txt;doc.head.appendChild(st)}}
  function hideOldBadges(){walkDocs().forEach(d=>['badge','v47-inner','v48-inner','v49-inner','v50-inner','v51-inner','v52-inner','v53-inner','v54-inner','v55-inner','v56-inner','v57-inner','v58-inner','v59-inner','v60-inner'].forEach(id=>{const el=d.getElementById(id);if(el)el.style.display='none'}));}
  function fixDesktopReferences(doc){
    if(phone)return;
    const card=doc.querySelector('.legend-card');
    if(!card)return;
    const h=card.querySelector('h3');
    if(h)h.textContent='Referencias';
    const items=card.querySelectorAll('.legend-item');
    if(items[0])items[0].querySelector('p').textContent='Elementos que conectan hábitats: bordes, cortinas, caminos, vías, franjas y corredores.';
    if(items[1])items[1].querySelector('p').textContent='Áreas o parches que brindan hábitat y recursos: parques, refugios, áreas naturales.';
    if(items[2])items[2].querySelector('p').textContent='Sitios o elementos puntuales que aportan refugio, posaderos o nidificación.';
    const more=card.querySelector('.legend-more');
    if(more){more.textContent='Más información →';card.appendChild(more);}
  }
  function mobileKeepExisting(doc){
    if(!phone)return;
    const h=doc.querySelector('.legend-card h3');
    if(h)h.textContent='Referencias';
  }
  function patch(){
    hideOldBadges();
    walkDocs().forEach(doc=>{addStyle(doc,'v61-shared',sharedCSS);addStyle(doc,'v61-desktop-fix',desktopFixCSS);fixDesktopReferences(doc);mobileKeepExisting(doc);if(doc.querySelector('.legend-card')&&!doc.getElementById('v61-inner')){const b=doc.createElement('div');b.id='v61-inner';b.textContent='v61';doc.body.appendChild(b);}});
  }
  app.addEventListener('load',()=>{setTimeout(()=>{patch();app.style.visibility='visible';loader.style.display='none'},1000);setInterval(patch,450)});
})();
</script>
</body>
</html>
