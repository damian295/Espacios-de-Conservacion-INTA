<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espacios de Conservación | V63 canónica</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9f6fb;font-family:system-ui,Arial,sans-serif}
#app{position:fixed;inset:0;width:100vw;height:100dvh;border:0;background:#e9f6fb;visibility:hidden}
.loader{position:fixed;inset:0;display:grid;place-items:center;background:#e9f6fb;color:#063f69;z-index:5;text-align:center}
.loader b{display:block;font-weight:1000;font-size:clamp(1.25rem,5vw,1.7rem);line-height:1.28}
#infoBtnV63{position:fixed;right:14px;top:14px;z-index:999999;border:1px solid rgba(255,255,255,.55);border-radius:999px;background:rgba(255,255,255,.18);color:#fff;font-weight:950;padding:10px 15px;box-shadow:0 8px 22px rgba(0,40,70,.18);backdrop-filter:blur(6px);display:none;cursor:pointer}
@media(max-width:699px){#infoBtnV63{top:10px;right:8px;padding:8px 12px;font-size:.92rem}}
</style>
</head>
<body>
<div class="loader" id="loader"><b>Cargando V.63<br>Espacios de Conservación<br>INTA - BID</b></div>
<iframe id="app" src="plataforma-v62-candidata.html?v=v63-base" title="Espacios de Conservación"></iframe>
<button id="infoBtnV63" type="button">Infografía completa</button>
<script>
(function(){
  const app=document.getElementById('app');
  const loader=document.getElementById('loader');
  const btn=document.getElementById('infoBtnV63');
  function walkDocs(){
    const docs=[];
    function walk(win,depth){
      if(!win||depth>10)return;
      try{
        const d=win.document;
        if(d&&d.body){
          docs.push(d);
          d.querySelectorAll('iframe').forEach(f=>{try{walk(f.contentWindow,depth+1)}catch(e){}});
        }
      }catch(e){}
    }
    try{walk(app.contentWindow,0)}catch(e){}
    return docs;
  }
  function openInfo(){
    const docs=walkDocs();
    for(const d of docs){
      const original=d.querySelector('#openInfoHeader');
      if(original){original.click();return;}
    }
  }
  function placeButton(){
    const docs=walkDocs();
    let shown=false;
    for(const d of docs){
      const nav=d.querySelector('.navbar,.nav-inner,header');
      if(nav){shown=true;break;}
    }
    btn.style.display=shown?'block':'none';
  }
  function removeVideoLoops(){
    walkDocs().forEach(d=>{
      d.querySelectorAll('.space-video video,#drawerMedia video').forEach(v=>{
        v.loop=false;
        v.removeAttribute('loop');
        if(!v.dataset.noLoopFixed){
          v.dataset.noLoopFixed='1';
          v.addEventListener('ended',()=>{try{v.pause()}catch(e){}});
        }
      });
    });
  }
  btn.addEventListener('click',openInfo);
  app.addEventListener('load',()=>{
    setTimeout(()=>{placeButton();removeVideoLoops();app.style.visibility='visible';loader.style.display='none'},700);
    setInterval(()=>{placeButton();removeVideoLoops()},1000);
  });
})();
</script>
</body>
</html>
