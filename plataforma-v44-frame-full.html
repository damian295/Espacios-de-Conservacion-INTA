<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espacios de Conservación | V44 control full</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f0fbff;font-family:system-ui,Arial,sans-serif}.loader{position:fixed;inset:0;display:grid;place-items:center;background:#f0fbff;color:#063f69;z-index:5;text-align:center}#app{position:fixed;inset:0;width:100vw;height:100dvh;border:0;background:#fff;visibility:hidden}#badge{position:fixed;left:8px;bottom:8px;z-index:999999;background:#e60000;color:#fff;border-radius:999px;padding:8px 11px;font:900 13px system-ui;box-shadow:0 5px 18px rgba(0,0,0,.25);pointer-events:none}
</style>
</head>
<body>
<div class="loader" id="loader"><b>Cargando V44...</b></div>
<iframe id="app" src="plataforma.html?v=v44-full" title="Espacios de Conservación"></iframe>
<div id="badge">v44</div>
<script>
(function(){
  const app=document.getElementById('app');
  const loader=document.getElementById('loader');
  const phone=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent||'')||((navigator.maxTouchPoints||0)>1&&Math.min(screen.width||0,screen.height||0)<900);
  const css=`
    #v44-inner{position:fixed;left:8px;bottom:8px;z-index:999999;background:#e60000;color:#fff;border-radius:999px;padding:8px 11px;font:900 13px system-ui;box-shadow:0 5px 18px rgba(0,0,0,.25);pointer-events:none}
    @media(max-width:900px){
      html,body{width:100%!important;max-width:100%!important;overflow-x:hidden!important}
      body.field-mode,body.mobile-field-v19.field-mode,body.mobile-field-v25.field-mode{width:100%!important;max-width:100%!important;background:linear-gradient(180deg,#f0fbff 0%,#f7fff3 100%)!important;-webkit-text-size-adjust:122%!important;text-size-adjust:122%!important}
      body.field-mode .top-strip,body.field-mode .navbar,body.field-mode .hero,body.field-mode .interactive-section,body.field-mode .sections,body.field-mode .footer,body.field-mode footer,
      body.mobile-field-v19.field-mode .top-strip,body.mobile-field-v19.field-mode .navbar,body.mobile-field-v19.field-mode .hero,body.mobile-field-v19.field-mode .interactive-section,body.mobile-field-v19.field-mode .sections,body.mobile-field-v19.field-mode .footer,body.mobile-field-v19.field-mode footer,
      body.mobile-field-v25.field-mode .top-strip,body.mobile-field-v25.field-mode .navbar,body.mobile-field-v25.field-mode .hero,body.mobile-field-v25.field-mode .interactive-section,body.mobile-field-v25.field-mode .sections,body.mobile-field-v25.field-mode .footer,body.mobile-field-v25.field-mode footer{width:100%!important;max-width:100%!important;margin-left:0!important;margin-right:0!important;box-sizing:border-box!important}
      body.field-mode .wrap,body.field-mode .hero .wrap,body.field-mode .interactive-section .wrap,body.field-mode .sections .wrap,
      body.mobile-field-v19.field-mode .wrap,body.mobile-field-v19.field-mode .hero .wrap,body.mobile-field-v19.field-mode .interactive-section .wrap,body.mobile-field-v19.field-mode .sections .wrap,
      body.mobile-field-v25.field-mode .wrap,body.mobile-field-v25.field-mode .hero .wrap,body.mobile-field-v25.field-mode .interactive-section .wrap,body.mobile-field-v25.field-mode .sections .wrap{width:100%!important;max-width:100%!important;margin:0!important;padding-left:18px!important;padding-right:18px!important;box-sizing:border-box!important}
      body.field-mode .hero-grid,body.field-mode .interactive-layout,body.field-mode .value-row,body.field-mode .mini-nav,body.field-mode .quick-grid,body.field-mode .space-grid,body.field-mode .steps-layout,body.field-mode .resources-grid,body.field-mode .info-blocks,body.field-mode .aportes-split,body.field-mode .drawer-extra,
      body.mobile-field-v19.field-mode .hero-grid,body.mobile-field-v19.field-mode .interactive-layout,body.mobile-field-v19.field-mode .value-row,body.mobile-field-v19.field-mode .mini-nav,body.mobile-field-v19.field-mode .quick-grid,body.mobile-field-v19.field-mode .space-grid,body.mobile-field-v19.field-mode .steps-layout,body.mobile-field-v19.field-mode .resources-grid,body.mobile-field-v19.field-mode .info-blocks,body.mobile-field-v19.field-mode .aportes-split,body.mobile-field-v19.field-mode .drawer-extra,
      body.mobile-field-v25.field-mode .hero-grid,body.mobile-field-v25.field-mode .interactive-layout,body.mobile-field-v25.field-mode .value-row,body.mobile-field-v25.field-mode .mini-nav,body.mobile-field-v25.field-mode .quick-grid,body.mobile-field-v25.field-mode .space-grid,body.mobile-field-v25.field-mode .steps-layout,body.mobile-field-v25.field-mode .resources-grid,body.mobile-field-v25.field-mode .info-blocks,body.mobile-field-v25.field-mode .aportes-split,body.mobile-field-v25.field-mode .drawer-extra{display:grid!important;grid-template-columns:1fr!important;width:100%!important;max-width:100%!important;gap:18px!important}
      body.field-mode .map-card,body.mobile-field-v19.field-mode .map-card,body.mobile-field-v25.field-mode .map-card{width:100vw!important;max-width:100vw!important;margin-left:calc(50% - 50vw)!important;margin-right:calc(50% - 50vw)!important;border-left:0!important;border-right:0!important;border-radius:0!important}
      body.field-mode #openConcepts,body.field-mode #openAportes,body.field-mode #openStepsBtn,
      body.mobile-field-v19.field-mode #openConcepts,body.mobile-field-v19.field-mode #openAportes,body.mobile-field-v19.field-mode #openStepsBtn,
      body.mobile-field-v25.field-mode #openConcepts,body.mobile-field-v25.field-mode #openAportes,body.mobile-field-v25.field-mode #openStepsBtn,
      body.field-mode .mini-nav--actions,body.mobile-field-v19.field-mode .mini-nav--actions,body.mobile-field-v25.field-mode .mini-nav--actions{display:none!important;visibility:hidden!important;height:0!important;min-height:0!important;max-height:0!important;margin:0!important;padding:0!important;overflow:hidden!important;pointer-events:none!important}
      body.field-mode #modeNormalBtn,body.mobile-field-v19.field-mode #modeNormalBtn,body.mobile-field-v25.field-mode #modeNormalBtn{background:#eef3f5!important;color:#7d909b!important;opacity:.42!important;filter:grayscale(1)!important;box-shadow:inset 0 0 0 1px rgba(120,145,160,.22)!important;cursor:not-allowed!important}
      body.field-mode #modeBtn,body.mobile-field-v19.field-mode #modeBtn,body.mobile-field-v25.field-mode #modeBtn{opacity:1!important;filter:none!important}
      body.field-mode .video-hint,body.mobile-field-v19.field-mode .video-hint,body.mobile-field-v25.field-mode .video-hint{text-align:justify!important;text-align-last:left!important;word-spacing:normal!important;letter-spacing:normal!important}
      .quick-selection-note.v44-note{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:12px!important;width:100%!important;box-sizing:border-box!important;padding:14px!important;margin:12px 0!important;border-radius:18px!important;background:linear-gradient(135deg,#fff7ec,#eef9ff)!important;border:1px solid rgba(245,130,32,.36)!important;border-left:6px solid #f58220!important;color:#063f69!important;font-weight:900!important;line-height:1.25!important;font-size:clamp(1.22rem,5.2vw,1.62rem)!important}.v44-note-text{flex:1 1 auto!important;min-width:0!important}.v44-clear{flex:0 0 auto!important;border:0!important;border-radius:999px!important;background:#f58220!important;color:#fff!important;font-weight:1000!important;padding:10px 13px!important;font-size:clamp(.95rem,3.7vw,1.15rem)!important}
    }`;
  function patch(){
    const doc=app.contentDocument;
    const win=app.contentWindow;
    if(!doc||!doc.body) return;
    if(!doc.getElementById('v44-style')){const st=doc.createElement('style');st.id='v44-style';st.textContent=css;doc.head.appendChild(st);}
    if(phone){
      doc.body.classList.add('field-mode','mobile-field-v19','mobile-field-v25','mobile-ready-v27');
      doc.querySelector('#modeBtn')?.classList.add('active');
      doc.querySelector('#modeNormalBtn')?.classList.remove('active');
      ['#openConcepts','#openAportes','#openStepsBtn'].forEach(s=>{const el=doc.querySelector(s);if(el){el.style.setProperty('display','none','important');el.style.setProperty('height','0','important');el.style.setProperty('padding','0','important');el.style.setProperty('margin','0','important');el.style.setProperty('visibility','hidden','important')}});
      const nav=doc.querySelector('.mini-nav--actions'); if(nav){nav.style.setProperty('display','none','important');nav.style.setProperty('height','0','important');nav.style.setProperty('padding','0','important');nav.style.setProperty('margin','0','important')}
      const off=doc.querySelector('#modeNormalBtn'); if(off){off.style.setProperty('background','#eef3f5','important');off.style.setProperty('color','#7d909b','important');off.style.setProperty('opacity','.42','important');off.style.setProperty('filter','grayscale(1)','important')}
      const hint=doc.querySelector('.video-hint'); if(hint){hint.style.setProperty('text-align','justify','important');hint.style.setProperty('text-align-last','left','important')}
    }
    const note=doc.querySelector('#quickSelectionNote');
    if(note){const raw=(note.textContent||'').trim(); if(raw&&!note.querySelector('.v44-clear')){const clean=raw.replace(/Anular$/i,'').trim();note.classList.add('v44-note');note.innerHTML='<span class="v44-note-text"></span><button class="v44-clear" type="button">Anular</button>';note.querySelector('.v44-note-text').textContent=clean;note.querySelector('.v44-clear').onclick=(ev)=>{ev.preventDefault();ev.stopPropagation();try{win.quickSelection=null;win.activeFilter='all';doc.querySelectorAll('#quickGrid .quick-card').forEach(x=>{x.classList.remove('active');x.setAttribute('aria-pressed','false')});doc.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x.dataset.filter==='all'));win.renderCards()}catch(e){}note.textContent='';note.classList.remove('v44-note')}}}
    if(!doc.getElementById('v44-inner')){const b=doc.createElement('div');b.id='v44-inner';b.textContent='v44';doc.body.appendChild(b)}
  }
  app.addEventListener('load',()=>{setTimeout(()=>{patch();app.style.visibility='visible';loader.style.display='none'},500);setInterval(patch,500)});
})();
</script>
</body>
</html>
