  function setImp(el,prop,val){if(el)el.style.setProperty(prop,val,'important')}
  function forceWidth(doc){
    setImp(doc.documentElement,'width','100%');setImp(doc.documentElement,'max-width','100%');setImp(doc.documentElement,'overflow-x','hidden');setImp(doc.body,'width','100%');setImp(doc.body,'max-width','100%');setImp(doc.body,'overflow-x','hidden');
    doc.querySelectorAll('.top-strip,.navbar,.hero,.interactive-section,.sections,.footer,footer').forEach(el=>{setImp(el,'width','100%');setImp(el,'max-width','100%');setImp(el,'margin-left','0');setImp(el,'margin-right','0')});
    doc.querySelectorAll('.wrap,.hero .wrap,.interactive-section .wrap,.sections .wrap').forEach(el=>{setImp(el,'width','100%');setImp(el,'max-width','100%');setImp(el,'margin','0');setImp(el,'padding-left','10px');setImp(el,'padding-right','10px');setImp(el,'box-sizing','border-box')});
    doc.querySelectorAll('.hero-grid,.interactive-layout,.value-row,.mini-nav,.quick-grid,.space-grid,.steps-layout,.resources-grid,.info-blocks,.aportes-split,.drawer-extra').forEach(el=>{setImp(el,'display','grid');setImp(el,'grid-template-columns','1fr');setImp(el,'width','100%');setImp(el,'max-width','100%')});
    doc.querySelectorAll('.map-card').forEach(el=>{setImp(el,'width','100vw');setImp(el,'max-width','100vw');setImp(el,'margin-left','calc(50% - 50vw)');setImp(el,'margin-right','calc(50% - 50vw)');setImp(el,'border-left','0');setImp(el,'border-right','0');setImp(el,'border-radius','0')});
  }
  function patch(){
    const doc=app.contentDocument, win=app.contentWindow;if(!doc||!doc.body)return;
    const meta=doc.querySelector('meta[name="viewport"]');if(meta)meta.setAttribute('content','width=device-width, initial-scale=1, viewport-fit=cover');
    if(!doc.getElementById('v45-style')){const st=doc.createElement('style');st.id='v45-style';st.textContent=css;doc.head.appendChild(st)}
    if(phone){doc.body.classList.add('field-mode','mobile-field-v45','mobile-ready-v27');doc.querySelector('#modeBtn')?.classList.add('active');doc.querySelector('#modeNormalBtn')?.classList.remove('active');forceWidth(doc)}
    ['#openConcepts','#openAportes','#openStepsBtn'].forEach(s=>{const el=doc.querySelector(s);if(el){setImp(el,'display','none');setImp(el,'height','0');setImp(el,'padding','0');setImp(el,'margin','0');setImp(el,'visibility','hidden')}});
    const nav=doc.querySelector('.mini-nav--actions');if(nav){setImp(nav,'display','none');setImp(nav,'height','0');setImp(nav,'padding','0');setImp(nav,'margin','0')}
    const off=doc.querySelector('#modeNormalBtn');if(off&&phone){setImp(off,'background','#eef3f5');setImp(off,'color','#7d909b');setImp(off,'opacity','.42');setImp(off,'filter','grayscale(1)')}
    const hint=doc.querySelector('.video-hint');if(hint){setImp(hint,'text-align','justify');setImp(hint,'text-align-last','left')}
    doc.querySelectorAll('button,.btn').forEach(b=>{const t=(b.textContent||'').trim().toLowerCase();if(t.includes('activar sonido'))b.classList.add('sound-btn-v45')});
    const dot=doc.querySelector('.video-hint .pulse-dot');const video=doc.querySelector('#introVideo');if(dot&&!dot.__v45){dot.__v45=true;dot.classList.add('countdown-v45')}if(dot){let remain=8;if(video&&isFinite(video.duration)&&video.duration>0){remain=Math.max(0,Math.ceil(video.duration-(video.currentTime||0)))}else if(video){remain=Math.max(0,8-Math.floor(video.currentTime||0))}if(doc.body.classList.contains('map-ready')){dot.textContent='Mapa';dot.classList.add('map-ready-v45')}else{dot.textContent=remain;dot.classList.remove('map-ready-v45')}}
    const note=doc.querySelector('#quickSelectionNote');if(note){const raw=(note.textContent||'').trim();if(raw&&!note.querySelector('.v45-clear')){const clean=raw.replace(/Anular$/i,'').trim();note.classList.add('v45-note');note.innerHTML='<span class="v45-note-text"></span><button class="v45-clear" type="button">Anular</button>';note.querySelector('.v45-note-text').textContent=clean;note.querySelector('.v45-clear').onclick=(ev)=>{ev.preventDefault();ev.stopPropagation();try{win.quickSelection=null;win.activeFilter='all';doc.querySelectorAll('#quickGrid .quick-card').forEach(x=>{x.classList.remove('active');x.setAttribute('aria-pressed','false')});doc.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x.dataset.filter==='all'));win.renderCards()}catch(e){}note.textContent='';note.classList.remove('v45-note')}}}
    if(!doc.getElementById('v45-inner')){const b=doc.createElement('div');b.id='v45-inner';b.textContent='v45';doc.body.appendChild(b)}
  }
