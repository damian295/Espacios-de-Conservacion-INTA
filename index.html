<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espacios de Conservación | Plataforma interactiva INTA</title>
<style>
body{margin:0;font-family:system-ui,Arial,sans-serif;background:#eef9ff;color:#063f69;display:grid;min-height:100dvh;place-items:center}.box{text-align:center;padding:24px}.spin{width:42px;height:42px;border:5px solid #b9dced;border-top-color:#0b8fca;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 14px}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box"><div class="spin"></div><b>Cargando plataforma corregida v22...</b></div>
<script>
(async()=>{
  const isPhone=()=>/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent||'')||((navigator.maxTouchPoints||0)>1&&Math.min(screen.width||0,screen.height||0)<900);
  const phone=isPhone();
  const css='<link rel="stylesheet" href="field-v19.css?v=94a46fac"><link rel="stylesheet" href="field-v22.css?v=3e6f7972">';
  const js='<scr'+'ipt id="field-v22-script">(()=>{const $=s=>document.querySelector(s);const phone='+phone+';function mark(){document.body.classList.toggle("mobile-field-v19",phone)}function campo(){mark();document.body.classList.add("field-mode");$("#modeBtn")?.classList.add("active");$("#modeNormalBtn")?.classList.remove("active")}function oficina(){mark();document.body.classList.remove("field-mode");$("#modeNormalBtn")?.classList.add("active");$("#modeBtn")?.classList.remove("active")}function tune(){document.querySelectorAll(".sound-btn-v22").forEach(b=>b.classList.remove("sound-btn-v22"));document.querySelectorAll("button,.btn").forEach(b=>{const t=(b.textContent||"").trim().toLowerCase();if(t.includes("activar sonido")){b.classList.add("sound-btn-v22");const row=b.parentElement;if(row&&row.firstElementChild!==b)row.insertBefore(b,row.firstElementChild)}});const titles=["diagnóstico rápido del espacio","diagnostico rapido del espacio","aportes diferenciados","aportes a la producción","aportes a la produccion","aportes a la conservación","aportes a la conservacion"];document.querySelectorAll(".drawer *,.drawer-extra *,.info-block *,.aporte-card *").forEach(el=>{const tx=(el.textContent||"").trim().toLowerCase();if(titles.some(x=>tx===x||tx.startsWith(x)))el.classList.add("drawer-title-v22")})}function init(){mark();if(phone&&!document.body.classList.contains("field-mode"))campo();$("#modeBtn")?.addEventListener("click",()=>setTimeout(()=>{campo();tune()},0),true);$("#modeNormalBtn")?.addEventListener("click",()=>setTimeout(()=>{oficina();tune()},0),true);window.addEventListener("orientationchange",()=>setTimeout(()=>{mark();tune()},150));window.addEventListener("resize",()=>setTimeout(()=>{mark();tune()},150));tune();setInterval(tune,1200)}document.readyState==="loading"?document.addEventListener("DOMContentLoaded",init):init();})();</scr'+'ipt>';
  try{
    const r=await fetch('plataforma.html?v=v22-'+Date.now(),{cache:'no-store'});
    let h=await r.text();
    h=h.replaceAll('Compará este espacio con lo que observás en el campo y revisá si cumple una función similar.','');
    h=h.replace('</head>',css+'</head>').replace('</body>',js+'</body>');
    if(phone) h=h.replace('<body>','<body class="field-mode mobile-field-v19">');
    document.open();document.write(h);document.close();
  }catch(e){document.body.innerHTML='<div class="box"><b>No se pudo cargar la plataforma corregida v22.</b></div>'}
})();
</script>
</body>
</html>
