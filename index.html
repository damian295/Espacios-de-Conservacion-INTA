  const js='<scr'+'ipt id="mobile-fix-final-script">'+`(function(){
 const qs=s=>document.querySelector(s),qsa=s=>Array.from(document.querySelectorAll(s));
 function isMob(){return window.matchMedia('(max-width:900px)').matches||((navigator.maxTouchPoints||0)>0&&window.innerWidth<=1024)||/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent||'')}
 function apply(){if(!isMob())return;document.body.classList.add('field-mode');qs('#modeBtn')?.classList.add('active');qs('#modeNormalBtn')?.classList.remove('active')}

 function zoom(v){const z=qs('#zoomRange'),img=qs('#modalImage'),box=qs('.modal-content');if(!z||!img||!box)return;v=Math.max(0,Math.min(100,Number(v)||0));z.min=0;z.max=100;z.value=v;box.classList.add('fit');if(v===0){box.classList.remove('zoomed');img.style.width='auto';img.style.maxWidth='96vw';img.style.maxHeight='calc(100dvh - 156px)';img.style.height='auto'}else{box.classList.add('zoomed');img.style.width=(100+v*1.35)+'vw';img.style.maxWidth='none';img.style.maxHeight='none';img.style.height='auto'}}
