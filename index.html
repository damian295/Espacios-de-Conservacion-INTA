(async()=>{

  const fix='<style id="FIX_FINAL_DOMINANTE_V17">html body.field-mode{-webkit-text-size-adjust:100%!important;text-size-adjust:100%!important;overflow-x:hidden!important}@media(min-width:761px){html body.field-mode{background:linear-gradient(90deg,#d9edf6 0 calc(50% - 230px),#f7fcff calc(50% - 230px) calc(50% + 230px),#d9edf6 calc(50% + 230px) 100%)!important}html body.field-mode .top-strip,html body.field-mode .navbar,html body.field-mode .hero,html body.field-mode .interactive-section,html body.field-mode .sections,html body.field-mode .footer,html body.field-mode footer{width:430px!important;max-width:430px!important;margin-left:auto!important;margin-right:auto!important;box-sizing:border-box!important}html body.field-mode .wrap,html body.field-mode .hero .wrap,html body.field-mode .interactive-section .wrap,html body.field-mode .sections .wrap{width:100%!important;max-width:100%!important;margin:0!important;padding-left:14px!important;padding-right:14px!important;box-sizing:border-box!important}html body.field-mode .hero-grid,html body.field-mode .interactive-layout,html body.field-mode .space-grid,html body.field-mode .quick-grid,html body.field-mode .info-blocks,html body.field-mode .aportes-split{display:grid!important;grid-template-columns:1fr!important;width:100%!important;max-width:100%!important}}@media(max-width:760px){html body.field-mode .top-strip,html body.field-mode .navbar,html body.field-mode .hero,html body.field-mode .interactive-section,html body.field-mode .sections,html body.field-mode .footer,html body.field-mode footer{width:100%!important;max-width:100%!important;margin-left:0!important;margin-right:0!important}html body.field-mode .wrap,html body.field-mode .hero .wrap,html body.field-mode .interactive-section .wrap,html body.field-mode .sections .wrap{width:100%!important;max-width:100%!important;margin:0!important;padding-left:13px!important;padding-right:13px!important;box-sizing:border-box!important}}html body.field-mode .hero-copy h1   const post='<scr'+'ipt id="FIX_FINAL_V17_SCRIPT">(()=>{const $=s=>document.querySelector(s);const campo=()=>{document.body.classList.add("field-mode");$("#modeBtn")?.classList.add("active");$("#modeNormalBtn")?.classList.remove("active")};const oficina=()=>{document.body.classList.remove("field-mode");$("#modeNormalBtn")?.classList.add("active");$("#modeBtn")?.classList.remove("active")};function init(){if('+phone()+'&&!document.body.classList.contains("field-mode"))campo();$("#modeBtn")?.addEventListener("click",()=>setTimeout(campo,0),true);$("#modeNormalBtn")?.addEventListener("click",()=>setTimeout(oficina,0),true)}document.readyState==="loading"?document.addEventListener("DOMContentLoaded",init):init();})();</scr'+'ipt>';
  try{
    const r=await fetch('plataforma.html?v=v17-field-fix-'+Date.now(),{cache:'no-store'});

    h=h.replaceAll('Compará este espacio con lo que observás en el campo y revisá si cumple una función similar.','');

    document.open();document.write(h);document.close();
