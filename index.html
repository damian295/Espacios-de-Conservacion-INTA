<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espacios de Conservación | Plataforma interactiva INTA</title>
<style>
body{margin:0;font-family:system-ui,Arial,sans-serif;background:#eef9ff;color:#063f69;display:grid;min-height:100dvh;place-items:center}.box{text-align:center;padding:24px}.spin{width:42px;height:42px;border:5px solid #b9dced;border-top-color:#0b8fca;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 14px}@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box"><div class="spin"></div><b>Cargando modo campo...</b></div>
<script>
(async()=>{
  const isPhone=()=>/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent||'')||((navigator.maxTouchPoints||0)>1&&Math.min(screen.width||0,screen.height||0)<900);
  const phone=isPhone();
  const css='<link rel="stylesheet" href="field-v19.css?v=94a46fac"><link rel="stylesheet" href="field-v23.css?v=68519f6f"><link rel="stylesheet" href="field-v24.css?v=058c5ae9"><link rel="stylesheet" href="field-v25.css?v=5a56cc7f">';
  const critical=phone?'<style id="mobile-prepaint-lock">html,body{background:#f0fbff!important}body{visibility:hidden!important}body.mobile-ready-v27{visibility:visible!important}body.mobile-field-v25{background:linear-gradient(180deg,#f0fbff 0%,#f7fff3 100%)!important}</style>':'';
  const js='<scr'+'ipt id="field-v27-script">(()=>{const $=s=>document.querySelector(s);const phone='+phone+';let obs=null;function forceField(){if(!phone)return;document.body.classList.add("field-mode","mobile-field-v19","mobile-field-v25","mobile-ready-v27");$("#modeBtn")?.classList.add("active");$("#modeNormalBtn")?.classList.remove("active");try{userMode=true}catch(e){}}function patchOriginalMode(){if(!phone)return;try{userMode=true}catch(e){}try{if(!setFieldMode.__lockedV27){const native=setFieldMode;setFieldMode=function(on,manual=false){native(true,false);forceField();return true};setFieldMode.__lockedV27=true}}catch(e){}}function tune(){forceField();document.querySelectorAll(".sound-btn-v22,.sound-btn-v23").forEach(b=>b.classList.remove("sound-btn-v22","sound-btn-v23"));document.querySelectorAll("button,.btn").forEach(b=>{const t=(b.textContent||"").trim().toLowerCase();if(t.includes("activar sonido")){b.classList.add("sound-btn-v23")}});const titles=["diagnóstico rápido del espacio","diagnostico rapido del espacio","aportes diferenciados","aportes a la producción","aportes a la produccion","aportes a la conservación","aportes a la conservacion"];document.querySelectorAll(".drawer *,.drawer-extra *,.info-block *,.aporte-card *").forEach(el=>{const tx=(el.textContent||"").trim().toLowerCase();if(titles.some(x=>tx===x||tx.startsWith(x)))el.classList.add("drawer-title-v23")})}function init(){patchOriginalMode();forceField();if(phone&&!obs){obs=new MutationObserver(()=>{if(!document.body.classList.contains("field-mode"))forceField();if($("#modeNormalBtn")?.classList.contains("active"))forceField()});obs.observe(document.body,{attributes:true,attributeFilter:["class"]})}$("#modeBtn")?.addEventListener("click",ev=>{if(phone){ev.preventDefault();ev.stopImmediatePropagation();forceField();tune()}},true);$("#modeNormalBtn")?.addEventListener("click",ev=>{if(phone){ev.preventDefault();ev.stopImmediatePropagation();forceField();tune()}},true);window.addEventListener("orientationchange",()=>setTimeout(()=>{patchOriginalMode();tune()},50),true);window.addEventListener("resize",()=>setTimeout(()=>{patchOriginalMode();tune()},50),true);window.addEventListener("scroll",()=>{forceField()},true);tune();setInterval(()=>{patchOriginalMode();tune()},250)}document.readyState==="loading"?document.addEventListener("DOMContentLoaded",init):init();})();</scr'+'ipt>';
  try{
    const r=await fetch('plataforma.html?v=v27-'+Date.now(),{cache:'no-store'});
    let h=await r.text();
    h=h.replaceAll('Compará este espacio con lo que observás en el campo y revisá si cumple una función similar.','');
    h=h.replaceAll('roquedal u hotel de insectos','hotel de insectos');
    h=h.replaceAll('roquedal','');
    if(phone){
      h=h.replace("let activeFilter='all', quickSelection=null, audioOn=false, userMode=false;","let activeFilter='all', quickSelection=null, audioOn=false, userMode=true;");
      h=h.replace('const auto=()=>{if(!userMode)setFieldMode(isMobileDevice(),false)};','const auto=()=>{setFieldMode(true,false)};');
      h=h.replace('media.addEventListener?.(\'change\',auto); window.addEventListener(\'resize\',auto); auto();','media.addEventListener?.(\'change\',()=>setFieldMode(true,false)); window.addEventListener(\'resize\',()=>setFieldMode(true,false)); setFieldMode(true,false);');
      h=h.replace('<button class="mode-option active" id="modeNormalBtn" type="button">🖥️ Modo oficina</button>','<button class="mode-option" id="modeNormalBtn" type="button">🖥️ Modo oficina</button>');
      h=h.replace('<button class="mode-option" id="modeBtn" type="button">📱 Modo campo</button>','<button class="mode-option active" id="modeBtn" type="button">📱 Modo campo</button>');
    }
    h=h.replace('</head>',critical+css+'</head>').replace('</body>',js+'</body>');
    if(phone) h=h.replace('<body>','<body class="field-mode mobile-field-v19 mobile-field-v25">');
    document.open();document.write(h);document.close();
  }catch(e){document.body.innerHTML='<div class="box"><b>No se pudo cargar la plataforma corregida v27.</b></div>'}
})();
</script>
</body>
</html>
