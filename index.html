<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Espacios de Conservación | Plataforma interactiva INTA</title><style>body{margin:0;font-family:system-ui,Arial,sans-serif;background:#eef9ff;color:#063f69;display:grid;min-height:100dvh;place-items:center}.box{padding:24px;text-align:center}.spin{width:42px;height:42px;border:5px solid #b9dced;border-top-color:#0b8fca;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 14px}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="box"><div class="spin"></div><b>Cargando plataforma…</b></div><script>
(async()=>{
  const base='https://raw.githubusercontent.com/damian295/Espacios-de-Conservacion-INTA/a5eb58d44ea271114cc030a238a25bc609ba1529/index.html';
  const isMobile=()=>window.matchMedia('(max-width:900px)').matches||((navigator.maxTouchPoints||0)>0&&window.innerWidth<=1024)||/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent||'');
  const patchScript='<scr'+'ipt id="campo-original-patch">'+`(function(){
 const qs=s=>document.querySelector(s),qsa=s=>Array.from(document.querySelectorAll(s));
 const lectura={
  'Bordes de cultivo o alambrado':'Buscá una franja continua con cobertura vegetal en el límite del lote o alambrado. Si no está totalmente limpia y conecta sectores, puede funcionar como corredor.',
  'Franja vegetada':'Observá si la banda mantiene pastos, flores o cobertura sin cortes rasos. Su valor aumenta cuando conecta sectores y no deja suelo desnudo.',
  'Bordes ribereños':'Confirmá que la vegetación acompañe el agua y proteja la orilla. Cuanto más continua sea la franja, mayor será su función de filtro y refugio.',
  'Cortinas':'Revisá continuidad de la hilera, especies presentes y fallas. Una cortina útil protege del viento y también ofrece sombra, posaderos y conectividad.',
  'Cercos vivos':'Miralo como un límite vivo: si acompaña el alambrado con arbustos, árboles o vegetación permanente, puede separar y conectar al mismo tiempo.',
  'Bordes de caminos':'Revisá banquina, cuneta y préstamo: si conservan vegetación estable, pueden aportar cobertura y conexión sin ocupar superficie productiva.',
  'Terraplén o bordes de vías férreas':'Observá el terraplén como corredor largo: su valor está en la continuidad, la vegetación espontánea y los pasos o alcantarillas asociados.',
  'Franja de bosque nativo':'Identificá si es una franja arbolada nativa y continua. Prioridad: no fragmentarla y cuidar sus bordes.',
  'Parque o área multifunción':'Reconocé árboles, plantas diversas y usos múltiples. Su aporte aumenta si combina sombra, flores, refugio y manejo de bajo disturbio.',
  'Parche seminatural o refugio':'Si es un manchón poco intervenido o de bajo uso productivo, puede funcionar como refugio. Importa delimitarlo y evitar disturbios fuertes.',
  'Parche natural':'Verificá si conserva vegetación natural o restaurada. Su valor aumenta cuando no queda aislado y se conecta con bordes o franjas.',
  'Área natural':'Mirala como un sector de manejo especial: pastizal, bajo, bañado, bosque o laguna. Requiere reglas claras de uso y monitoreo.',
  'Estructura clave':'Detectá el recurso puntual: poste, árbol muerto, tronco, molino, cavidad u hotel de insectos. Su valor depende de ofrecer refugio, posadero o cría.'
 };
 function mob(){return matchMedia('(max-width:900px)').matches||((navigator.maxTouchPoints||0)>0&&innerWidth<=1024)||/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent||'')}
 function forceCampo(){if(!mob())return;document.body.classList.add('field-mode');qs('#modeBtn')?.classList.add('active');qs('#modeNormalBtn')?.classList.remove('active')}
 function stopMedia(){qsa('#drawer video,#drawer audio').forEach(v=>{try{v.pause();v.currentTime=0;v.muted=true}catch(e){}})}
 function patchLectura(){const t=(qs('#drawerTitle')?.textContent||'').trim();const txt=lectura[t];if(!txt)return;qsa('.drawer-context article').forEach(a=>{const b=(a.querySelector('b')?.textContent||'').trim();if(b==='Lectura rápida'){const p=a.querySelector('p');if(p)p.textContent=txt;}})}
 function patchZoom(v){const z=qs('#zoomRange'),img=qs('#modalImage'),box=qs('.modal-content');if(!z||!img||!box)return;v=Math.max(0,Math.min(100,Number(v)||0));z.min=0;z.max=100;z.value=v;box.classList.add('fit');if(v===0){box.classList.remove('zoomed');img.style.width='auto';img.style.maxWidth='96vw';img.style.maxHeight='calc(100dvh - 156px)';img.style.height='auto'}else{box.classList.add('zoomed');img.style.width=(100+v*1.35)+'vw';img.style.maxWidth='none';img.style.maxHeight='none';img.style.height='auto'}}
 function init(){forceCampo();const z=qs('#zoomRange');if(z){z.addEventListener('input',e=>{e.stopImmediatePropagation();patchZoom(z.value)},true);qs('#zoomOut')?.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();patchZoom((+z.value||0)-10)},true);qs('#zoomIn')?.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();patchZoom((+z.value||0)+10)},true);qs('#zoomFit')?.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();patchZoom(0)},true);qs('#modalImage')?.addEventListener('click',()=>setTimeout(()=>patchZoom((+z.value||0)>0?0:60),0),true);patchZoom(0)}['#closeDrawer','#backToMap'].forEach(sel=>qs(sel)?.addEventListener('click',stopMedia,true));document.addEventListener('click',()=>setTimeout(patchLectura,80),true);document.addEventListener('keydown',e=>{if(e.key==='Escape')stopMedia()},true);const d=qs('#drawer');if(d)new MutationObserver(patchLectura).observe(d,{childList:true,subtree:true,characterData:true});setTimeout(()=>{forceCampo();patchLectura()},250)}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
 addEventListener('resize',forceCampo);addEventListener('orientationchange',()=>setTimeout(forceCampo,250));
})();`+'</scr'+'ipt>';
  try{
    const r=await fetch(base+'?v='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('No se pudo cargar base');
    let html=await r.text();
    if(isMobile()) html=html.replace('<body>','<body class="field-mode">');
    html=html.replace('</body>',patchScript+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){document.body.innerHTML='<div class="box"><b>No se pudo cargar la plataforma.</b><p>Probá actualizar o abrir en Chrome.</p></div>';console.error(e)}
})();
</script></body></html>
