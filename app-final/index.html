const f=document.getElementById('app');function patch(){const d=f.contentDocument;if(!d)return;document.getElementById('loader').classList.add('hide');const img=d.getElementById('infoImg');if(img)img.src=POSTER;const hero=d.querySelector('.hero');const box=d.querySelector('.heroText');if(hero&&!d.getElementById('ecoToggle')){hero.style.position='relative';const b=d.createElement('button');b.id='ecoToggle';b.textContent='Ecosistemas pampeanos';b.style.cssText='position:absolute;left:12px;top:12px;z-index:9;border:0;border-radius:999px;background:rgba(255,255,255,.95);color:#0b4e78;padding:10px 13px;font-weight:950;box-shadow:0 6px 18px rgba(0,0,0,.18);font:inherit;cursor:pointer';let visible=true;function toggle(){visible=!visible;if(box)box.style.display=visible?'block':'none';b.textContent=visible?'Ecosistemas pampeanos':'Mostrar leyenda'}b.onclick=toggle;if(box){box.style.cursor='pointer';box.addEventListener('click',toggle)}hero.appendChild(b)}d.getElementById('openInfo')?.addEventListener('click',()=>setTimeout(()=>{const im=d.getElementById('infoImg');if(im)im.src=POSTER},40));}f.addEventListener('load',()=>{setTimeout(patch,200);setTimeout(patch,1000)});setInterval(patch,3000);</script></body></html>
