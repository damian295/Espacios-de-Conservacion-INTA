<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espacios de Conservación | V56 candidata</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9f6fb;font-family:system-ui,Arial,sans-serif}#app{position:fixed;inset:0;width:100vw;height:100dvh;border:0;background:#e9f6fb;visibility:hidden}.loader{position:fixed;inset:0;display:grid;place-items:center;background:#e9f6fb;color:#063f69;z-index:5;text-align:center}.loader b{display:block;font-weight:1000;font-size:clamp(1.25rem,5vw,1.7rem);line-height:1.28}#badge{position:fixed;left:8px;bottom:8px;z-index:999999;background:#0b8fca;color:#fff;border-radius:999px;padding:8px 11px;font:900 13px system-ui;box-shadow:0 5px 18px rgba(0,0,0,.25);pointer-events:none}
</style>
</head>
<body>
<div class="loader" id="loader"><b>Cargando V.56<br>Espacios de Conservación<br>INTA - BID</b></div>
<iframe id="app" title="Espacios de Conservación"></iframe>
<div id="badge">v56</div>
<script>
(function(){
  const app=document.getElementById('app');
  const loader=document.getElementById('loader');
  const phone=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent||'')||((navigator.maxTouchPoints||0)>1&&Math.min(screen.width||0,screen.height||0)<900);
  app.src=phone?'plataforma-v54-candidata.html?v=v56-mobile':'plataforma.html?v=v56-pc';
  const css=`
    #v56-inner{position:fixed;right:8px;bottom:8px;z-index:999999;background:#0b8fca;color:#fff;border-radius:999px;padding:7px 10px;font:900 12px system-ui;box-shadow:0 5px 18px rgba(0,0,0,.22);pointer-events:none}
    .v56-zoom-target{transition:transform .08s linear!important;will-change:transform!important}
    input[type='range']{accent-color:#0b8fca!important;touch-action:none!important}
    body.field-mode .map-section-head h2,body.field-mode .interactive-section .section-head h2{font-size:clamp(1.72rem,6.35vw,2.2rem)!important;line-height:1.05!important;letter-spacing:-.04em!important}
    body.field-mode .legend-card{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:8px!important;align-items:stretch!important}
    body.field-mode .legend-card h3{grid-column:1 / -1!important}
    body.field-mode .legend-more{grid-column:auto!important;width:100%!important;height:auto!important;min-height:100%!important;display:grid!important;place-items:center!important;text-align:center!important;margin:0!important;padding:8px 5px!important;border:1px solid rgba(11,143,202,.16)!important;border-radius:14px!important;background:#fff!important;color:#0b5e86!important;font-size:clamp(.9rem,3.15vw,1rem)!important;line-height:1.06!important;font-weight:1000!important;box-shadow:none!important;white-space:normal!important}
  `;
  function walkDocs(){
    const docs=[];
    function walk(win,depth){
      if(!win||depth>8)return;
      try{
        const d=win.document;
        if(d&&d.body){docs.push(d);d.querySelectorAll('iframe').forEach(f=>{try{walk(f.contentWindow,depth+1)}catch(e){}});}
      }catch(e){}
    }
    try{walk(app.contentWindow,0)}catch(e){}
    return docs;
  }
  function platformDoc(){
    const docs=walkDocs();
    return docs.find(d=>d.querySelector('.map-card')&&d.querySelector('.legend-card'))||docs[docs.length-1]||null;
  }
  function hideBadges(){
    walkDocs().forEach(d=>['badge','v47-inner','v48-inner','v49-inner','v50-inner','v51-inner','v52-inner','v53-inner','v54-inner','v55-inner'].forEach(id=>{const el=d.getElementById(id);if(el)el.style.display='none'}));
  }
  function findZoomTarget(doc,range){
    const roots=[];
    let n=range;
    for(let i=0;n&&i<9;i++,n=n.parentElement)roots.push(n);
    roots.push(doc.querySelector('.modal.open'),doc.querySelector('.modal'),doc.querySelector('.modal-content'),doc.body);
    const selectors=['#modalImage','.modal-content img','.modal img','img[src*="infografia"]','img[src*="infografía"]','img[src*="plana"]','img[src*="concept"]','img[src*="aporte"]','.zoomable','canvas'];
    for(const root of roots){
      if(!root)continue;
      for(const sel of selectors){
        const el=root.querySelector?.(sel);
        if(el&&el!==range)return el;
      }
    }
    let best=null,area=0;
    doc.querySelectorAll('img,canvas').forEach(el=>{const r=el.getBoundingClientRect?.();const a=r?r.width*r.height:0;if(a>area){area=a;best=el;}});
    return best;
  }
  function patchZoom(doc){
    doc.querySelectorAll('input[type="range"]').forEach(r=>{
      if(r.__v56)return;r.__v56=true;
      const apply=()=>{
        const val=Number(r.value||0),min=Number(r.min||0),max=Number(r.max||100);
        const pct=max>min?(val-min)/(max-min):val/100;
        const scale=1+(Math.max(0,Math.min(1,pct))*2.25);
        const target=findZoomTarget(doc,r);
        if(target){target.classList.add('v56-zoom-target');target.style.setProperty('transform',`scale(${scale})`,'important');target.style.setProperty('transform-origin','center center','important');target.style.setProperty('max-width','none','important');target.style.setProperty('max-height','none','important')}
        ['.modal.open','.modal','.modal-content','.lightbox'].map(s=>doc.querySelector(s)).filter(Boolean).forEach(c=>{c.style.setProperty('overflow','auto','important');c.style.setProperty('touch-action','pan-x pan-y','important')});
      };
      ['input','change','pointermove','pointerup','touchmove','touchend','mousedown','mouseup'].forEach(ev=>r.addEventListener(ev,apply,{passive:true}));
      setTimeout(apply,80);
    });
  }
  function mobileOnly(doc){
    if(!phone)return;
    const h=[...doc.querySelectorAll('h1,h2,h3')].find(x=>{const t=(x.textContent||'').replace(/\s+/g,' ').trim().toLowerCase();return t.includes('explorá el paisaje')&&t.includes('abrí las fichas')});
    if(h){h.style.setProperty('font-size','clamp(1.72rem,6.35vw,2.2rem)','important');h.style.setProperty('line-height','1.05','important');h.style.setProperty('letter-spacing','-.04em','important')}
    const card=doc.querySelector('.legend-card');const btn=doc.querySelector('.legend-more');
    if(card&&btn){card.appendChild(btn);btn.textContent='Más información →';btn.style.setProperty('grid-column','auto','important');btn.style.setProperty('display','grid','important')}
  }
  function patch(){
    hideBadges();
    walkDocs().forEach(d=>{if(!d.getElementById('v56-style')){const st=d.createElement('style');st.id='v56-style';st.textContent=css;d.head.appendChild(st)}patchZoom(d)});
    const doc=platformDoc();
    if(doc)mobileOnly(doc);
    if(doc&&!doc.getElementById('v56-inner')){const b=doc.createElement('div');b.id='v56-inner';b.textContent='v56';doc.body.appendChild(b)}
  }
  app.addEventListener('load',()=>{setTimeout(()=>{patch();app.style.visibility='visible';loader.style.display='none'},900);let n=0;const timer=setInterval(()=>{patch();if(++n>32)clearInterval(timer)},500)});
})();
</script>
</body>
</html>
