<body>
<div class="box"><div class="spin"></div><b>Cargando prueba v36...</b></div>
<script>
(async()=>{
  const isPhone=()=>/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent||'')||((navigator.maxTouchPoints||0)>1&&Math.min(screen.width||0,screen.height||0)<900);
  const phone=isPhone();
  const links='<link rel="stylesheet" href="field-v19.css?v=94a46fac"><link rel="stylesheet" href="field-v23.css?v=68519f6f"><link rel="stylesheet" href="field-v24.css?v=058c5ae9"><link rel="stylesheet" href="field-v25.css?v=5a56cc7f"><link rel="stylesheet" href="field-v28.css?v=6bbb1ec7">';
  const css='<style id="direct-v36">#v36-badge{position:fixed;left:8px;bottom:8px;z-index:999999;background:#e60000;color:#fff;border-radius:999px;padding:8px 11px;font:900 13px system-ui;box-shadow:0 5px 18px rgba(0,0,0,.25)}@media(max-width:900px){body.field-mode #openConcepts,body.field-mode #openAportes,body.field-mode #openStepsBtn,body.field-mode .mini-nav--actions,body.mobile-field-v19.field-mode #openConcepts,body.mobile-field-v19.field-mode #openAportes,body.mobile-field-v19.field-mode #openStepsBtn,body.mobile-field-v19.field-mode .mini-nav--actions,body.mobile-field-v25.field-mode #openConcepts,body.mobile-field-v25.field-mode #openAportes,body.mobile-field-v25.field-mode #openStepsBtn,body.mobile-field-v25.field-mode .mini-nav--actions{display:none!important;visibility:hidden!important;height:0!important;min-height:0!important;max-height:0!important;margin:0!important;padding:0!important;overflow:hidden!important;pointer-events:none!important}body.field-mode #modeNormalBtn,body.mobile-field-v19.field-mode #modeNormalBtn,body.mobile-field-v25.field-mode #modeNormalBtn{background:#eef3f5!important;color:#7d909b!important;opacity:.42!important;filter:grayscale(1)!important;box-shadow:inset 0 0 0 1px rgba(120,145,160,.22)!important;cursor:not-allowed!important}body.field-mode .video-hint,body.mobile-field-v19.field-mode .video-hint,body.mobile-field-v25.field-mode .video-hint{text-align:justify!important;text-align-last:left!important;word-spacing:normal!important;letter-spacing:normal!important}.quick-selection-note.v36-note{display:flex!important;align-items:center!important;justify-content:space-between!important;gap:12px!important;width:100%!important;box-sizing:border-box!important;padding:14px!important;margin:12px 0!important;border-radius:18px!important;background:linear-gradient(135deg,#fff7ec,#eef9ff)!important;border:1px solid rgba(245,130,32,.36)!important;border-left:6px solid #f58220!important;color:#063f69!important;font-weight:900!important;line-height:1.25!important;font-size:clamp(1.22rem,5.2vw,1.62rem)!important}.v36-note-text{flex:1 1 auto!important;min-width:0!important}.v36-clear{flex:0 0 auto!important;border:0!important;border-radius:999px!important;background:#f58220!important;color:#fff!important;font-weight:1000!important;padding:10px 13px!important;font-size:clamp(.95rem,3.7vw,1.15rem)!important}}</style>';
  const js='<scr'+'ipt id="direct-v36-script">(()=>{const phone='+phone+';const $=s=>document.querySelector(s);let timer=null;function force(){if(phone){document.body.classList.add("field-mode","mobile-field-v19","mobile-field-v25","mobile-ready-v27");$("#modeBtn")?.classList.add("active");$("#modeNormalBtn")?.classList.remove("active");try{userMode=true}catch(e){}}}function hideBlocks(){["#openConcepts","#openAportes","#openStepsBtn"].forEach(s=>{const el=$(s);if(el){el.style.setProperty("display","none","important");el.style.setProperty("height","0","important");el.style.setProperty("padding","0","important");el.style.setProperty("margin","0","important");el.style.setProperty("visibility","hidden","important");}});const nav=$(".mini-nav--actions");if(nav){nav.style.setProperty("display","none","important");nav.style.setProperty("height","0","important");nav.style.setProperty("padding","0","important");nav.style.setProperty("margin","0","important");}}function officeDim(){const b=$("#modeNormalBtn");if(b&&phone){b.style.setProperty("background","#eef3f5","important");b.style.setProperty("color","#7d909b","important");b.style.setProperty("opacity",".42","important");b.style.setProperty("filter","grayscale(1)","important");}}function justifyHint(){const h=$(".video-hint");if(h){h.style.setProperty("text-align","justify","important");h.style.setProperty("text-align-last","left","important");}}function note(){const n=$("#quickSelectionNote");if(!n)return;const raw=(n.textContent||"").trim();if(!raw){n.classList.remove("v36-note");n.innerHTML="";return}if(n.querySelector(".v36-clear"))return;const clean=raw.replace(/Anular$/i,"").trim();n.classList.add("v36-note");n.innerHTML="<span class=\"v36-note-text\"></span><button class=\"v36-clear\" type=\"button\">Anular</button>";n.querySelector(".v36-note-text").textContent=clean;n.querySelector(".v36-clear").onclick=(ev)=>{ev.preventDefault();ev.stopPropagation();try{quickSelection=null;activeFilter="all";document.querySelectorAll("#quickGrid .quick-card").forEach(x=>{x.classList.remove("active");x.setAttribute("aria-pressed","false")});document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x.dataset.filter==="all"));renderCards()}catch(e){}n.textContent="";n.classList.remove("v36-note")}}function run(){force();hideBlocks();officeDim();justifyHint();note();if(!$("#v36-badge")){const d=document.createElement("div");d.id="v36-badge";d.textContent="v36";document.body.appendChild(d)}}function init(){run();timer=setInterval(run,300);window.addEventListener("scroll",run,true);window.addEventListener("resize",run,true);window.addEventListener("orientationchange",()=>setTimeout(run,80),true)}document.readyState==="loading"?document.addEventListener("DOMContentLoaded",init):init();})();</scr'+'ipt>';
  try{
    const r=await fetch('plataforma.html?v=prueba-v36-'+Date.now(),{cache:'no-store'});
    let h=await r.text();
    h=h.replaceAll('Compará este espacio con lo que observás en el campo y revisá si cumple una función similar.','');
    h=h.replaceAll('roquedal u hotel de insectos','hotel de insectos');
    h=h.replaceAll('roquedal','');
    if(phone){
      h=h.replace("let activeFilter='all', quickSelection=null, audioOn=false, userMode=false;","let activeFilter='all', quickSelection=null, audioOn=false, userMode=true;");
      h=h.replace('const auto=()=>{if(!userMode)setFieldMode(isMobileDevice(),false)};','const auto=()=>{setFieldMode(true,false)};');
      h=h.replace('media.addEventListener?.(\'change\',auto); window.addEventListener(\'resize\',auto); auto();','media.addEventListener?.(\'change\',()=>setFieldMode(true,false)); window.addEventListener(\'resize\',()=>setFieldMode(true,false)); setFieldMode(true,false);');
      h=h.replace('<button class="mode-option active" id="modeNormalBtn" type="button">🖥️ Modo oficina</button>','<button class="mode-option" id="modeNormalBtn" type="button">🖥️ Modo oficina</button>');
      h=h.replace('<button class="mode-option" id="modeBtn" type="button">📱 Modo campo</button>','<button class="mode-option active" id="modeBtn" type="button">📱 Modo campo</button>');
    }
    h=h.replace('</head>',links+css+'</head>').replace('</body>',js+'</body>');
    if(phone)h=h.replace('<body>','<body class="field-mode mobile-field-v19 mobile-field-v25 mobile-ready-v27">');
    document.open();document.write(h);document.close();
  }catch(e){document.body.innerHTML='<div class="box"><b>Error en prueba v36.</b></div>'}
})();
