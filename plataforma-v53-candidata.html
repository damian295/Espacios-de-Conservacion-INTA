  function patch(){const doc=app.contentDocument;if(!doc||!doc.body)return;if(!doc.getElementById('v53-style')){const st=doc.createElement('style');st.id='v53-style';st.textContent=css;doc.head.appendChild(st)}if(phone){doc.body.classList.add('field-mode','mobile-field-v53','mobile-ready-v27');doc.querySelector('#modeBtn')?.classList.add('active');doc.querySelector('#modeNormalBtn')?.classList.remove('active');forceWidth(doc)}hideInfografia(doc);fixLogos(doc);fixText(doc);justifyVideoHint(doc);setupCounter(doc);fixZoom(doc);doc.querySelectorAll('button,.btn').forEach(b=>{const t=(b.textContent||'').trim().toLowerCase();if(t.includes('activar sonido'))b.classList.add('sound-btn-v53')});const c=doc.querySelector('.close-x');if(c)c.setAttribute('aria-label','Cerrar');if(!doc.getElementById('v53-inner')){const b=doc.createElement('div');b.id='v53-inner';b.textContent='v53';doc.body.appendChild(b)}}
  app.addEventListener('load',()=>{setTimeout(()=>{patch();app.style.visibility='visible';loader.style.display='none'},650);let n=0;const timer=setInterval(()=>{patch();if(++n>28)clearInterval(timer)},450);setInterval(()=>{const doc=app.contentDocument;if(doc)setupCounter(doc)},700)});
})();
</script>
