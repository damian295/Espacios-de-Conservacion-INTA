<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espacios de Conservación | V54 candidata</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9f6fb;font-family:system-ui,Arial,sans-serif}#app{position:fixed;inset:0;width:100vw;height:100dvh;border:0;background:#e9f6fb;visibility:hidden}.loader{position:fixed;inset:0;display:grid;place-items:center;background:#e9f6fb;color:#063f69;z-index:5;text-align:center}.loader b{display:block;font-weight:1000;font-size:clamp(1.25rem,5vw,1.7rem);line-height:1.28}#badge{position:fixed;left:8px;bottom:8px;z-index:999999;background:#0b8fca;color:#fff;border-radius:999px;padding:8px 11px;font:900 13px system-ui;box-shadow:0 5px 18px rgba(0,0,0,.25);pointer-events:none}
</style>
</head>
<body>
<div class="loader" id="loader"><b>Cargando V.54<br>Espacios de Conservación<br>INTA - BID</b></div>
<iframe id="app" src="plataforma-v53-candidata.html?v=v54-base" title="Espacios de Conservación"></iframe>
<div id="badge">v54</div>
<script>
(function(){
  const app=document.getElementById('app');
  const loader=document.getElementById('loader');
  const css=`
    #v54-inner{position:fixed;right:8px;bottom:8px;z-index:999999;background:#0b8fca;color:#fff;border-radius:999px;padding:7px 10px;font:900 12px system-ui;box-shadow:0 5px 18px rgba(0,0,0,.22);pointer-events:none}
    body.field-mode .brand-card--bid,body.field-mode .brand-card--bid *,body.field-mode .bid-logo-img{background:transparent!important;box-shadow:none!important;border:0!important}
    body.field-mode .brand-card--bid{background:#e9f6fb!important}
    body.field-mode .brand-card--bid .bid-logo-img{mix-blend-mode:normal!important;filter:contrast(1.08) saturate(1.04)!important;image-rendering:auto!important}
    body.field-mode .legend-card{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:8px!important;align-items:stretch!important}
    body.field-mode .legend-card h3{grid-column:1 / -1!important}
    body.field-mode .legend-more{grid-column:auto!important;width:100%!important;height:auto!important;min-height:100%!important;display:grid!important;place-items:center!important;text-align:center!important;margin:0!important;padding:8px 5px!important;border:1px solid rgba(11,143,202,.16)!important;border-radius:14px!important;background:#ffffff!important;color:#0b5e86!important;font-size:clamp(.9rem,3.15vw,1rem)!important;line-height:1.06!important;font-weight:1000!important;box-shadow:none!important;white-space:normal!important}
    body.field-mode .legend-item{min-width:0!important}
    body.field-mode #quickGrid .quick-card b,
    body.field-mode .field-guide .quick-card b,
    body.field-mode .side-column .quick-card b{
      font-size:clamp(1.45rem,5.65vw,1.86rem)!important;
      line-height:1.12!important;
      letter-spacing:-.015em!important;
      color:#16394f!important;
      font-weight:1000!important;
      display:block!important;
    }
    body.field-mode #quickGrid .quick-card,
    body.field-mode .field-guide .quick-card{
      min-height:108px!important;
      padding:18px!important;
      gap:16px!important;
      align-items:center!important;
    }
    body.field-mode #quickGrid .quick-card img,
    body.field-mode .field-guide .quick-card img{
      width:86px!important;
      height:86px!important;
      flex:0 0 86px!important;
    }
  `;
  function deepDocs(){
    const docs=[];
    function walk(win,depth){
      if(!win||depth>6)return;
      try{
        const d=win.document;
        if(d&&d.body){docs.push(d);d.querySelectorAll('iframe').forEach(f=>{try{walk(f.contentWindow,depth+1)}catch(e){}});}
      }catch(e){}
    }
    try{walk(app.contentWindow,0)}catch(e){}
    return docs;
  }
  function platformDoc(){
    const docs=deepDocs();
    return docs.find(d=>d.querySelector('.brand-wall')&&d.querySelector('#quickGrid'))||docs[docs.length-1]||null;
  }
  function hideOldBadges(){
    deepDocs().forEach(d=>['badge','v47-inner','v48-inner','v49-inner','v50-inner','v51-inner','v52-inner','v53-inner'].forEach(id=>{const el=d.getElementById(id);if(el)el.style.display='none'}));
  }
  function transparentizeBid(doc){
    const img=doc.querySelector('.bid-logo-img');
    if(!img||img.dataset.v54Transparent==='done')return;
    const run=()=>{
      try{
        if(!img.naturalWidth||!img.naturalHeight)return;
        const c=doc.createElement('canvas');
        const w=img.naturalWidth,h=img.naturalHeight;
        c.width=w;c.height=h;
        const ctx=c.getContext('2d',{willReadFrequently:true});
        ctx.drawImage(img,0,0,w,h);
        const im=ctx.getImageData(0,0,w,h);
        const data=im.data;
        for(let i=0;i<data.length;i+=4){
          const r=data[i],g=data[i+1],b=data[i+2];
          const max=Math.max(r,g,b),min=Math.min(r,g,b);
          if(max>235 && (max-min)<28){data[i+3]=0;}
          else if(max>220 && (max-min)<22){data[i+3]=Math.min(data[i+3],70);}
        }
        ctx.putImageData(im,0,0);
        img.dataset.v54Transparent='done';
        img.src=c.toDataURL('image/png');
        img.style.setProperty('background','transparent','important');
        img.style.setProperty('mix-blend-mode','normal','important');
      }catch(e){
        img.style.setProperty('mix-blend-mode','multiply','important');
        img.style.setProperty('background','transparent','important');
      }
    };
    if(img.complete)run(); else img.addEventListener('load',run,{once:true});
  }
  function patchLegend(doc){
    const card=doc.querySelector('.legend-card');
    const btn=doc.querySelector('.legend-more');
    if(!card||!btn)return;
    card.appendChild(btn);
    btn.textContent='Más información →';
  }
  function patchQuickLabels(doc){
    const wanted=new Set(['Borde de cultivo / alambrado','Camino / vía / banquina','Agua / arroyo / bajo / laguna','Árboles en línea','Manchón o parche natural','Elemento puntual']);
    doc.querySelectorAll('#quickGrid .quick-card b,.field-guide .quick-card b').forEach(b=>{
      if(wanted.has((b.textContent||'').trim())){
        b.style.setProperty('font-size','clamp(1.45rem,5.65vw,1.86rem)','important');
        b.style.setProperty('line-height','1.12','important');
        b.style.setProperty('font-weight','1000','important');
      }
    });
  }
  function patch(){
    hideOldBadges();
    const doc=platformDoc();
    if(!doc||!doc.body)return;
    if(!doc.getElementById('v54-style')){const st=doc.createElement('style');st.id='v54-style';st.textContent=css;doc.head.appendChild(st)}
    transparentizeBid(doc);
    patchLegend(doc);
    patchQuickLabels(doc);
    if(!doc.getElementById('v54-inner')){const b=doc.createElement('div');b.id='v54-inner';b.textContent='v54';doc.body.appendChild(b)}
  }
  app.addEventListener('load',()=>{
    setTimeout(()=>{patch();app.style.visibility='visible';loader.style.display='none'},800);
    let n=0;const timer=setInterval(()=>{patch();if(++n>24)clearInterval(timer)},450);
  });
})();
</script>
</body>
</html>
