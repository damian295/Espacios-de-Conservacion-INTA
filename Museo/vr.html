<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Museo | Vista VR 360</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
    #viewer{position:fixed;inset:0;overflow:hidden;background:#000;cursor:grab}
    .pano{position:absolute;top:50%;height:100vh;width:auto;min-width:100vw;transform:translate3d(0,-50%,0);will-change:transform;user-select:none;-webkit-user-drag:none;pointer-events:none}
    .hud{position:fixed;left:12px;right:12px;top:12px;z-index:20;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
    .label{color:#fff;background:rgba(0,0,0,.58);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:9px 12px;font-size:13px;line-height:1.25;backdrop-filter:blur(6px);max-width:62vw}.label strong{display:block;font-size:14px;margin-bottom:2px}
    .btns{display:flex;gap:8px;pointer-events:auto}button{border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:9px 12px;color:#fff;background:rgba(0,0,0,.6);font-weight:700;font-size:13px}
    #visor{display:none;position:fixed;inset:0;background:#000;z-index:30}.eye{position:absolute;top:0;width:50%;height:100%;overflow:hidden;border-right:1px solid #111}.eye.r{left:50%;border-right:0}.eye img{position:absolute;top:50%;height:100vh;width:auto;min-width:100vw;transform:translate3d(0,-50%,0);user-select:none;-webkit-user-drag:none;pointer-events:none}#closeVisor{position:fixed;right:12px;top:12px;z-index:40}
    #status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;background:rgba(0,0,0,.6);padding:12px 16px;border-radius:12px;font-size:14px;z-index:50;text-align:center}
    @media(max-width:720px){.label{font-size:12px;padding:8px 10px;max-width:58vw}.label strong{font-size:13px}button{font-size:12px;padding:8px 10px}}
  </style>
</head>
<body>
  <div id="status">Cargando imagen...</div>
  <div id="viewer"></div>
  <div class="hud"><div class="label"><strong>Museo · Vista 360°</strong>Mové el teléfono o arrastrá la imagen. Tocá “visor” para modo VR simple.</div><div class="btns"><button id="visorBtn" type="button">visor</button></div></div>
  <div id="visor"><button id="closeVisor" type="button">salir</button><div class="eye l"></div><div class="eye r"></div></div>
  <script>
    const statusEl=document.getElementById('status');
    const viewer=document.getElementById('viewer');
    const visor=document.getElementById('visor');
    let x=0,dragging=false,lastX=0,imgW=innerWidth,imgs=[];
    function mod(n,m){return ((n%m)+m)%m}
    function measure(){const ratio=1600/228;imgW=Math.max(innerWidth,innerHeight*ratio);imgs.forEach(im=>{im.style.width=imgW+'px';im.style.height='100vh'})}
    function render(){if(imgs.length){const a=mod(x,imgW)-imgW;imgs.forEach((im,i)=>{const offset=(i%2)*imgW;im.style.transform=`translate3d(${a+offset}px,-50%,0)`})}requestAnimationFrame(render)}
    function addPair(parent,src){const a=new Image();const b=new Image();a.src=src;b.src=src;a.className='pano';b.className='pano';parent.append(a,b);imgs.push(a,b)}
    function start(cx){dragging=true;lastX=cx;viewer.style.cursor='grabbing'}function move(cx){if(!dragging)return;const dx=cx-lastX;lastX=cx;x+=dx}function end(){dragging=false;viewer.style.cursor='grab'}
    viewer.addEventListener('mousedown',e=>start(e.clientX));addEventListener('mousemove',e=>move(e.clientX));addEventListener('mouseup',end);viewer.addEventListener('touchstart',e=>start(e.touches[0].clientX),{passive:true});viewer.addEventListener('touchmove',e=>move(e.touches[0].clientX),{passive:true});viewer.addEventListener('touchend',end);
    addEventListener('deviceorientation',e=>{if(typeof e.alpha==='number'&&!dragging)x=-(e.alpha/360)*imgW});addEventListener('resize',measure);
    document.getElementById('visorBtn').onclick=()=>{visor.style.display='block'};document.getElementById('closeVisor').onclick=()=>{visor.style.display='none'};
    async function init(){try{const t=await fetch('./index.html?v=src2',{cache:'no-store'}).then(r=>r.text());const m=t.match(/data:image\/jpeg;base64,[A-Za-z0-9+/=]+/);if(!m)throw new Error('No encontré la imagen embebida');const src=m[0];addPair(viewer,src);addPair(document.querySelector('.eye.l'),src);addPair(document.querySelector('.eye.r'),src);measure();statusEl.remove()}catch(e){statusEl.textContent='No cargó la imagen. Probá recargar o avisame.';console.error(e)}}
    init();render();
  </script>
</body>
</html>
