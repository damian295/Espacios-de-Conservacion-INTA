<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Museo | Vista VR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .hud {
      position: fixed;
      left: 12px;
      right: 12px;
      top: 12px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }
    .label {
      color: #fff;
      background: rgba(0,0,0,.55);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 14px;
      padding: 9px 12px;
      font-size: 13px;
      line-height: 1.25;
      backdrop-filter: blur(6px);
    }
    .label strong {
      display: block;
      font-size: 14px;
      margin-bottom: 2px;
    }
    .fallback {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    @media (max-width: 720px) {
      .hud {
        top: 10px;
        left: 10px;
        right: 10px;
      }
      .label {
        font-size: 12px;
        padding: 8px 10px;
      }
      .label strong {
        font-size: 13px;
      }
    }
  </style>
</head>

    <div class="label">
      <strong>Museo · Vista VR</strong>
      Mové el teléfono o arrastrá la imagen. Para visor VR, tocá el ícono de gafas.
    </div>
  </div>
