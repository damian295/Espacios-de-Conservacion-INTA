<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Museo VR prueba</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
  #stage{position:fixed;inset:0;overflow:hidden;background:#111}
  #pano{position:absolute;top:0;left:50%;height:100%;width:auto;max-width:none;transform:translateX(-50%);user-select:none;-webkit-user-drag:none;filter:contrast(1.04) saturate(1.04)}
  #status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:18px 20px;font-size:18px;text-align:center;max-width:86vw;line-height:1.35}
  .hud{position:fixed;left:14px;right:14px;bottom:14px;z-index:15;background:rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.2);border-radius:18px;padding:14px 16px;font-size:18px;line-height:1.35;backdrop-filter:blur(7px)}
  .hud strong{display:block;font-size:22px;margin-bottom:4px}
  .top{position:fixed;left:14px;top:14px;z-index:16;background:rgba(0,0,0,.60);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:10px 14px;font-size:18px;font-weight:700}
  button{font:inherit;font-weight:800;border:0;border-radius:999px;padding:10px 14px;margin-top:8px;background:#fff;color:#111}
  @media(max-width:720px){.hud{font-size:17px;padding:13px 14px}.hud strong{font-size:21px}.top{font-size:17px}#status{font-size:17px}}
</style>
</head>
<body>
<div id="stage"><img id="pano" alt="Vista de prueba del museo"></div>
<div id="status">Cargando imagen...</div>
<div class="top">Museo · prueba 360</div>
<div class="hud"><strong>Vista de prueba</strong>Esta foto no es 360 real: la estoy forzando como panorama para probar desde el celular. Arrastrá con el dedo o mové el teléfono.<br><button id="center">Centrar</button></div>
<script>
const pano=document.getElementById('pano'), statusEl=document.getElementById('status'), center=document.getElementById('center');
let offset=0, drag=false, last=0, ready=false, maxOffset=0;
function calc(){maxOffset=Math.max(0,(pano.getBoundingClientRect().width-innerWidth)/2);offset=Math.max(-maxOffset,Math.min(maxOffset,offset));paint()}
function paint(){pano.style.transform='translateX(calc(-50% + '+offset+'px))'}
function start(x){drag=true;last=x}
function move(x){if(!drag||!ready)return;offset+=x-last;last=x;offset=Math.max(-maxOffset,Math.min(maxOffset,offset));paint()}
function end(){drag=false}
document.addEventListener('pointerdown',e=>start(e.clientX));document.addEventListener('pointermove',e=>move(e.clientX));document.addEventListener('pointerup',end);document.addEventListener('pointercancel',end);
window.addEventListener('resize',calc);
window.addEventListener('deviceorientation',e=>{if(!ready||drag||typeof e.alpha!=='number')return;const t=(e.alpha/360)*2-1;offset=-t*maxOffset;paint()},true);
center.onclick=()=>{offset=0;paint()};
async function init(){try{const html=await fetch('./index.html?cache='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()});const m=html.match(/data:image\/jpeg;base64,[A-Za-z0-9+/=]+/);if(!m)throw new Error('No encontré la imagen embebida');pano.onload=()=>{ready=true;statusEl.remove();calc()};pano.onerror=()=>{statusEl.textContent='La imagen no pudo decodificarse'};pano.src=m[0]}catch(err){statusEl.textContent='No cargó la imagen. Avisame y reviso otra ruta.';console.error(err)}}
init();
</script>
</body>
</html>
