<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Museo | Visor panorámico</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;color:#fff}
  #viewer{position:fixed;inset:0;background:#000 center center/auto 100% repeat-x;will-change:background-position;cursor:grab}
  #viewer.grab{cursor:grabbing}
  #status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:14px 18px;font-size:14px;text-align:center;max-width:82vw}
  .hud{position:fixed;left:12px;right:12px;top:12px;z-index:15;display:flex;justify-content:space-between;gap:10px;pointer-events:none}.label{background:rgba(0,0,0,.56);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:9px 12px;font-size:13px;line-height:1.25;backdrop-filter:blur(6px);max-width:66vw}.label strong{display:block;font-size:14px;margin-bottom:2px}.btns{display:flex;gap:8px;pointer-events:auto}button{border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:9px 12px;color:#fff;background:rgba(0,0,0,.65);font-weight:700;font-size:13px}
  #vr{display:none;position:fixed;inset:0;z-index:30;background:#000}.eye{position:absolute;top:0;width:50%;height:100%;background:#000 center center/auto 100% repeat-x}.eye.r{left:50%;border-left:1px solid #111}#close{position:fixed;right:12px;top:12px;z-index:40}
  @media(max-width:720px){.label{font-size:12px;max-width:60vw}.label strong{font-size:13px}button{font-size:12px;padding:8px 10px}}
</style>
</head>
<body>
<div id="viewer"></div>
<div id="status">Cargando imagen...</div>
<div class="hud"><div class="label"><strong>Museo · vista panorámica</strong>Arrastrá con el dedo o mové el teléfono. Botón “visor” para modo gafas.</div><div class="btns"><button id="vrBtn" type="button">visor</button></div></div>
<div id="vr"><button id="close" type="button">salir</button><div class="eye l"></div><div class="eye r"></div></div>
<script>
const viewer=document.getElementById('viewer'), statusEl=document.getElementById('status'), vr=document.getElementById('vr');
const eyeL=document.querySelector('.eye.l'), eyeR=document.querySelector('.eye.r');
let pos=0, dragging=false, lastX=0, loaded=false;
function setPos(){viewer.style.backgroundPositionX=pos+'px';eyeL.style.backgroundPositionX=pos+'px';eyeR.style.backgroundPositionX=(pos-60)+'px'}
function start(x){dragging=true;lastX=x;viewer.classList.add('grab')}
function move(x){if(!dragging)return;pos += x-lastX;lastX=x;setPos()}
function end(){dragging=false;viewer.classList.remove('grab')}
viewer.addEventListener('mousedown',e=>start(e.clientX));addEventListener('mousemove',e=>move(e.clientX));addEventListener('mouseup',end);
viewer.addEventListener('touchstart',e=>start(e.touches[0].clientX),{passive:true});viewer.addEventListener('touchmove',e=>move(e.touches[0].clientX),{passive:true});viewer.addEventListener('touchend',end);
addEventListener('deviceorientation',e=>{if(loaded && typeof e.alpha==='number'&&!dragging){pos=-(e.alpha/360)*1600;setPos()}});
document.getElementById('vrBtn').onclick=()=>{vr.style.display='block';setPos()};document.getElementById('close').onclick=()=>vr.style.display='none';
async function init(){try{const html=await fetch('./index.html?cache='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()});const m=html.match(/data:image\/jpeg;base64,[A-Za-z0-9+/=]+/);if(!m)throw new Error('No se encontró la imagen embebida');const src=m[0];const test=new Image();test.onload=()=>{viewer.style.backgroundImage=`url("${src}")`;eyeL.style.backgroundImage=`url("${src}")`;eyeR.style.backgroundImage=`url("${src}")`;loaded=true;statusEl.remove();setPos()};test.onerror=()=>{throw new Error('La imagen no pudo decodificarse')};test.src=src}catch(err){statusEl.textContent='No cargó la imagen. Avisame y lo rehago con otra ruta.';console.error(err)}}
init();
</script>
</body>
</html>
