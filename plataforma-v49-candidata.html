    body.mobile-field-v47.field-mode .hero{border-bottom:1px solid rgba(6,63,105,.18)!important}
    body.mobile-field-v47.field-mode .mode-panel,body.mobile-field-v47.field-mode .mode-switch,body.mobile-field-v47.field-mode .mode-options,body.mobile-field-v47.field-mode .field-toggle,body.mobile-field-v47.field-mode .nav-actions{background:#e9f6fb!important}

    body.mobile-field-v47.field-mode .brand-wall .bid-card{width:31vw!important;max-width:210px!important;min-height:126px!important;margin:0!important;padding:14px 10px!important;border-radius:20px!important;box-shadow:0 10px 22px rgba(3,74,116,.14)!important;border-left:0!important;border:1px solid rgba(11,143,202,.25)!important;background:#e9f6fb!important}
    body.mobile-field-v47.field-mode .bid-icon{width:56px!important;height:56px!important}body.mobile-field-v47.field-mode .bid-word{font-size:2.8rem!important}body.mobile-field-v47.field-mode .bid-small{font-size:.78rem!important}
    body.mobile-field-v47.field-mode .quick-grid,body.mobile-field-v47.field-mode .space-grid,body.mobile-field-v47.field-mode .resources-grid,body.mobile-field-v47.field-mode .mini-nav,body.mobile-field-v47.field-mode .drawer-extra,body.mobile-field-v47.field-mode .aportes-split,body.mobile-field-v47.field-mode .info-blocks{gap:22px!important}
    body.mobile-field-v47.field-mode .quick-card,body.mobile-field-v47.field-mode .space-card,body.mobile-field-v47.field-mode .resource-card,body.mobile-field-v47.field-mode .value,body.mobile-field-v47.field-mode .info-block,body.mobile-field-v47.field-mode .aporte-card,body.mobile-field-v47.field-mode .mini-card{background:#f2fbff!important;border-color:rgba(11,143,202,.32)!important;box-shadow:0 14px 30px rgba(5,78,118,.13)!important;margin-bottom:4px!important}
    body.mobile-field-v47.field-mode .space-card{overflow:hidden!important;border-radius:26px!important;background:#eef8fb!important}
    body.mobile-field-v47.field-mode .space-body{padding:23px!important;background:#f2fbff!important}
    body.mobile-field-v47.field-mode .space-title{gap:14px!important;align-items:flex-start!important;margin-bottom:8px!important}
    body.mobile-field-v47.field-mode .space-card h3{font-size:clamp(1.76rem,6.55vw,2.28rem)!important;line-height:1.06!important;letter-spacing:-.025em!important;color:#0b314d!important}
    body.mobile-field-v47.field-mode .space-card p{margin:14px 0 0!important;line-height:1.5!important;color:#405d70!important}
    body.mobile-field-v47.field-mode .drawer{background:#e9f6fb!important;box-shadow:0 -18px 42px rgba(0,34,60,.22)!important}
    body.mobile-field-v47.field-mode .drawer-top{background:linear-gradient(135deg,#07547d 0%,#0b8fca 62%,#477b30 100%)!important;color:#fff!important;border:0!important;border-radius:24px!important;padding:22px!important;box-shadow:0 14px 30px rgba(0,30,60,.24)!important;margin-bottom:18px!important}
    body.mobile-field-v47.field-mode .drawer-top h3{font-size:clamp(1.9rem,7vw,2.45rem)!important;line-height:1.05!important;color:#fff!important;margin:0!important}
    body.mobile-field-v47.field-mode .drawer-top .drawer-type,body.mobile-field-v47.field-mode .drawer-top *{color:#fff!important}
    body.mobile-field-v47.field-mode .close-x{background:#fff!important;color:#063f69!important;border:4px solid #0b8fca!important;position:relative!important}
    body.mobile-field-v47.field-mode .close-x::before{content:'×'!important;display:grid!important;place-items:center!important;font-weight:1000!important;line-height:1!important;color:#063f69!important}
    body.mobile-field-v47.field-mode .drawer p,body.mobile-field-v47.field-mode .drawer li,body.mobile-field-v47.field-mode .drawer-extra p,body.mobile-field-v47.field-mode .aporte-card p,body.mobile-field-v47.field-mode .info-block p{line-height:1.52!important;margin-top:12px!important;margin-bottom:14px!important}
    body.mobile-field-v47.field-mode .drawer-extra,body.mobile-field-v47.field-mode .aporte-card,body.mobile-field-v47.field-mode .info-block{padding:21px!important;border-radius:23px!important;background:#f2fbff!important;border:1px solid rgba(66,115,38,.22)!important;box-shadow:0 10px 24px rgba(5,78,118,.10)!important;margin-top:16px!important;margin-bottom:8px!important}
    body.mobile-field-v47.field-mode .drawer-extra b,body.mobile-field-v47.field-mode .info-block h4,body.mobile-field-v47.field-mode .aporte-card b{font-size:clamp(1.5rem,5.65vw,1.86rem)!important;color:#073b5c!important}
    body.mobile-field-v47.field-mode .tag{margin-top:16px!important;background:#e2f4fb!important;color:#06496f!important;border:1px solid rgba(11,143,202,.22)!important}
    body.mobile-field-v47.field-mode .video-hint .pulse-dot.countdown-v47,body.mobile-field-v47.field-mode .video-hint .pulse-dot.countdown-v48,body.mobile-field-v47.field-mode .video-hint .pulse-dot{background:#0b8fca!important;color:#fff!important;animation:pulseHintV49 1.2s infinite!important}
    body.mobile-field-v47.field-mode .sound-btn-v47{background:#0b8fca!important;color:#fff!important;box-shadow:0 6px 16px rgba(11,143,202,.34)!important}.sound-btn-v47::before{color:#0b8fca!important}
    body.mobile-field-v47.field-mode .legend-card{background:#f2fbff!important;border-color:rgba(11,143,202,.25)!important;box-shadow:0 10px 24px rgba(5,78,118,.10)!important;margin-top:-2px!important;transform:translateY(-4px)!important}
    body.mobile-field-v47.field-mode .legend-card h3{font-size:clamp(1.5rem,5.3vw,1.78rem)!important}
    body.mobile-field-v47.field-mode .legend-item b{font-size:clamp(1.18rem,4.3vw,1.36rem)!important}
    body.mobile-field-v47.field-mode .legend-item p{font-size:clamp(1.02rem,3.75vw,1.16rem)!important;line-height:1.16!important}
    body.mobile-field-v47.field-mode .section-head{margin-top:36px!important;margin-bottom:20px!important}
    body.mobile-field-v47.field-mode .section-head h2{color:#053d61!important}
    body.mobile-field-v47.field-mode .quick-selection-note.v47-note{box-shadow:0 10px 24px rgba(11,143,202,.12)!important;background:#eef8fb!important}
    body.mobile-field-v47.field-mode .modalbar,body.mobile-field-v47.field-mode .modal-tools{background:#e9f6fb!important}
    body.mobile-field-v47.field-mode input[type='range']{accent-color:#0b8fca!important;touch-action:none!important}
  `;
  function getPlatformDoc(){
    try{
      const v47doc=app.contentDocument;
      const inner=v47doc&&v47doc.querySelector('#app');
      if(inner&&inner.contentDocument&&inner.contentDocument.body)return inner.contentDocument;
      if(v47doc&&v47doc.body)return v47doc;
    }catch(e){}
    return null;
  }
  function setImp(el,prop,val){if(el)el.style.setProperty(prop,val,'important')}
  function fixText(doc){
    const lh=doc.querySelector('.legend-card h3');if(lh&&/leyenda/i.test(lh.textContent||''))lh.textContent='Referencias';
    doc.querySelectorAll('.legend-item p').forEach(p=>{
      let t=(p.textContent||'').trim();
      if(/lineales/i.test(t))p.textContent='Franjas o corredores de vegetación.';
      else if(/superficie/i.test(t)||/manchones/i.test(t))p.textContent='Áreas amplias de conservación.';
      else if(/concretas/i.test(t)||/percha/i.test(t)||/nidificación/i.test(t))p.textContent='Elementos puntuales útiles para fauna.';
    });
  }
  function fixZoom(doc){
    const ranges=[...doc.querySelectorAll('input[type="range"]')];
    ranges.forEach(r=>{
      if(r.__v49)return;r.__v49=true;
      const apply=()=>{
        const val=Number(r.value||100);
        const min=Number(r.min||0), max=Number(r.max||100);
        const pct=max>min?(val-min)/(max-min):val/100;
        const scale=1+(pct*2.2);
        const modal=doc.querySelector('.modal.open,.modal');
        const img=doc.querySelector('#modalImage,.modal img,.modal-content img');
        const content=doc.querySelector('.modal-content');
        if(img){img.style.setProperty('transform',`scale(${scale})`,'important');img.style.setProperty('transform-origin','center center','important');img.style.setProperty('transition','transform .08s linear','important');img.style.setProperty('max-width','96vw','important');img.style.setProperty('max-height','calc(100dvh - 160px)','important')}
        if(content){content.style.setProperty('overflow','auto','important')}
        if(modal){modal.style.setProperty('overflow','auto','important')}
      };
      ['input','change','touchmove','touchend','pointermove','pointerup'].forEach(ev=>r.addEventListener(ev,apply,{passive:true}));
      apply();
    });
  }
  function patch(){
    const doc=getPlatformDoc();
    if(!doc||!doc.body)return;
    if(!doc.getElementById('v49-polish-style')){const st=doc.createElement('style');st.id='v49-polish-style';st.textContent=polishCSS;doc.head.appendChild(st)}
    if(phone)doc.body.classList.add('mobile-field-v47','field-mode');
    const brand=doc.querySelector('.brand-wall');if(brand){brand.style.setProperty('justify-content','center','important');brand.style.setProperty('background','#e9f6fb','important')}
    const c=doc.querySelector('.close-x');if(c&&!c.textContent.trim())c.textContent='×';
    fixText(doc);fixZoom(doc);
    if(!doc.getElementById('v49-inner')){const b=doc.createElement('div');b.id='v49-inner';b.textContent='v49';doc.body.appendChild(b)}
  }
  app.addEventListener('load',()=>{setTimeout(()=>{patch();app.style.visibility='visible';loader.style.display='none'},750);setInterval(patch,450)});
})();
</script>
