<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espacios de Conservación | V48 pulido visual</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f0fbff;font-family:system-ui,Arial,sans-serif}#app{position:fixed;inset:0;width:100vw;height:100dvh;border:0;background:#fff;visibility:hidden}.loader{position:fixed;inset:0;display:grid;place-items:center;background:#f0fbff;color:#063f69;z-index:5;text-align:center}#badge{position:fixed;left:8px;bottom:8px;z-index:999999;background:#17405f;color:#fff;border-radius:999px;padding:8px 11px;font:900 13px system-ui;box-shadow:0 5px 18px rgba(0,0,0,.25);pointer-events:none}
</style>
</head>
<body>
<div class="loader" id="loader"><b>Cargando V48...</b></div>
<iframe id="app" src="plataforma-v47-campo-ajustado.html?v=v48-base" title="Espacios de Conservación"></iframe>
<div id="badge">v48</div>
<script>
(function(){
  const app=document.getElementById('app');
  const loader=document.getElementById('loader');
  const phone=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent||'')||((navigator.maxTouchPoints||0)>1&&Math.min(screen.width||0,screen.height||0)<900);
  const polishCSS=`
    #v48-inner{position:fixed;right:8px;bottom:8px;z-index:999999;background:#17405f;color:#fff;border-radius:999px;padding:7px 10px;font:900 12px system-ui;box-shadow:0 5px 18px rgba(0,0,0,.22);pointer-events:none}
    body.mobile-field-v47.field-mode{background:linear-gradient(180deg,#e9f6fb 0%,#f2fbef 100%)!important}
    body.mobile-field-v47.field-mode .hero{background:linear-gradient(180deg,#e3f3fb 0%,#f2fbff 100%)!important;border-bottom:1px solid rgba(6,63,105,.18)!important}
    body.mobile-field-v47.field-mode .interactive-section,body.mobile-field-v47.field-mode .sections{background:linear-gradient(180deg,#eef8fb 0%,#edf7ea 100%)!important}
    body.mobile-field-v47.field-mode .brand-wall{width:100%!important;max-width:100%!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:14px!important;margin:8px auto 2px!important;padding:0 8px!important;box-sizing:border-box!important}
    body.mobile-field-v47.field-mode .brand-wall .bio-logo{width:56%!important;max-width:245px!important;max-height:160px!important;object-fit:contain!important;transform:none!important;transform-origin:center!important;margin:0!important;filter:drop-shadow(0 10px 18px rgba(0,80,120,.12))!important}
    body.mobile-field-v47.field-mode .brand-wall .bid-card{width:34%!important;max-width:145px!important;min-height:88px!important;margin:0!important;padding:10px 8px!important;border-radius:18px!important;box-shadow:0 10px 22px rgba(3,74,116,.14)!important;border-left:0!important;border:1px solid rgba(11,143,202,.25)!important}
    body.mobile-field-v47.field-mode .bid-icon{width:42px!important;height:42px!important}body.mobile-field-v47.field-mode .bid-word{font-size:2.1rem!important}body.mobile-field-v47.field-mode .bid-small{font-size:.62rem!important}
    body.mobile-field-v47.field-mode .quick-grid,body.mobile-field-v47.field-mode .space-grid,body.mobile-field-v47.field-mode .resources-grid,body.mobile-field-v47.field-mode .mini-nav,body.mobile-field-v47.field-mode .drawer-extra,body.mobile-field-v47.field-mode .aportes-split,body.mobile-field-v47.field-mode .info-blocks{gap:22px!important}
    body.mobile-field-v47.field-mode .quick-card,body.mobile-field-v47.field-mode .space-card,body.mobile-field-v47.field-mode .resource-card,body.mobile-field-v47.field-mode .value,body.mobile-field-v47.field-mode .info-block,body.mobile-field-v47.field-mode .aporte-card,body.mobile-field-v47.field-mode .mini-card{background:linear-gradient(180deg,#ffffff 0%,#f4fbfe 100%)!important;border-color:rgba(11,143,202,.32)!important;box-shadow:0 14px 30px rgba(5,78,118,.13)!important;margin-bottom:4px!important}
    body.mobile-field-v47.field-mode .space-card{overflow:hidden!important;border-radius:26px!important}
    body.mobile-field-v47.field-mode .space-body{padding:22px!important;background:linear-gradient(180deg,#ffffff 0%,#f5fbff 100%)!important}
    body.mobile-field-v47.field-mode .space-title{gap:14px!important;align-items:flex-start!important;margin-bottom:8px!important}
    body.mobile-field-v47.field-mode .space-card h3{font-size:clamp(1.76rem,6.55vw,2.28rem)!important;line-height:1.06!important;letter-spacing:-.025em!important;color:#0b314d!important}
    body.mobile-field-v47.field-mode .space-card p{margin:12px 0 0!important;line-height:1.46!important;color:#405d70!important}
    body.mobile-field-v47.field-mode .drawer{background:#eef8fb!important;box-shadow:0 -18px 42px rgba(0,34,60,.22)!important}
    body.mobile-field-v47.field-mode .drawer-top{background:linear-gradient(135deg,#042f4e 0%,#064d77 58%,#285c25 100%)!important;color:#fff!important;border:0!important;border-radius:24px!important;padding:22px!important;box-shadow:0 15px 34px rgba(0,30,60,.32)!important;margin-bottom:18px!important}
    body.mobile-field-v47.field-mode .drawer-top h3{font-size:clamp(1.9rem,7vw,2.45rem)!important;line-height:1.05!important;color:#fff!important;margin:0!important}
    body.mobile-field-v47.field-mode .drawer-top .drawer-type,body.mobile-field-v47.field-mode .drawer-top *{color:#fff!important}
    body.mobile-field-v47.field-mode .drawer p,body.mobile-field-v47.field-mode .drawer li,body.mobile-field-v47.field-mode .drawer-extra p,body.mobile-field-v47.field-mode .aporte-card p,body.mobile-field-v47.field-mode .info-block p{line-height:1.48!important;margin-top:10px!important;margin-bottom:12px!important}
    body.mobile-field-v47.field-mode .drawer-extra,body.mobile-field-v47.field-mode .aporte-card,body.mobile-field-v47.field-mode .info-block{padding:20px!important;border-radius:22px!important;background:linear-gradient(180deg,#ffffff 0%,#f2fbf8 100%)!important;border:1px solid rgba(66,115,38,.22)!important;box-shadow:0 10px 24px rgba(5,78,118,.10)!important;margin-top:14px!important}
    body.mobile-field-v47.field-mode .drawer-extra b,body.mobile-field-v47.field-mode .info-block h4,body.mobile-field-v47.field-mode .aporte-card b{font-size:clamp(1.5rem,5.65vw,1.86rem)!important;color:#073b5c!important}
    body.mobile-field-v47.field-mode .tag{margin-top:16px!important;background:#e9f6fb!important;color:#06496f!important;border:1px solid rgba(11,143,202,.22)!important}
    body.mobile-field-v47.field-mode .legend-card{background:linear-gradient(180deg,#ffffff 0%,#f0f8fb 100%)!important;border-color:rgba(11,143,202,.25)!important;box-shadow:0 10px 24px rgba(5,78,118,.10)!important}
    body.mobile-field-v47.field-mode .section-head{margin-top:34px!important;margin-bottom:18px!important}
    body.mobile-field-v47.field-mode .section-head h2{color:#053d61!important}
    body.mobile-field-v47.field-mode .quick-selection-note.v47-note{box-shadow:0 10px 24px rgba(245,130,32,.13)!important;background:linear-gradient(135deg,#fff4e7,#ecf8fc)!important}
  `;
  function getPlatformDoc(){
    try{
      const v47doc=app.contentDocument;
      const inner=v47doc&&v47doc.querySelector('#app');
      if(inner&&inner.contentDocument&&inner.contentDocument.body)return inner.contentDocument;
      if(v47doc&&v47doc.body)return v47doc;
    }catch(e){}
    return null;
  }
  function patch(){
    const doc=getPlatformDoc();
    if(!doc||!doc.body)return;
    if(!doc.getElementById('v48-polish-style')){const st=doc.createElement('style');st.id='v48-polish-style';st.textContent=polishCSS;doc.head.appendChild(st)}
    if(phone)doc.body.classList.add('mobile-field-v47','field-mode');
    const brand=doc.querySelector('.brand-wall');
    if(brand){brand.style.setProperty('justify-content','center','important');brand.style.setProperty('margin-left','auto','important');brand.style.setProperty('margin-right','auto','important')}
    const drawerTop=doc.querySelector('.drawer-top');
    if(drawerTop){drawerTop.style.setProperty('background','linear-gradient(135deg,#042f4e 0%,#064d77 58%,#285c25 100%)','important')}
    if(!doc.getElementById('v48-inner')){const b=doc.createElement('div');b.id='v48-inner';b.textContent='v48';doc.body.appendChild(b)}
  }
  app.addEventListener('load',()=>{setTimeout(()=>{patch();app.style.visibility='visible';loader.style.display='none'},650);setInterval(patch,500)});
})();
</script>
</body>
</html>
